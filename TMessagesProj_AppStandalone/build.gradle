apply plugin: 'com.android.application'
apply plugin: 'org.telegram.build-app-plugin'

repositories {
    mavenCentral()
    google()
}

configurations {
    compile.exclude module: 'support-v4'
}

configurations.all {
    exclude group: 'com.google.firebase', module: 'firebase-core'
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
}

dependencies {
    implementation project(':TMessagesProj')
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.core:core:1.16.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation files('../TMessagesProj/libs/libgsaverification-client.aar')
}

android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'

    defaultConfig.applicationId = APP_PACKAGE


    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }

    androidResources {
        noCompress += "pack"
        localeFilters += ["zz"]
    }

    signingConfigs {
        // DealsGram: no custom debug config. Debug builds share the app.dealsgram package with the release, so they
        // are signed with the Android SDK debug key of the machine that builds them (~/.android/debug.keystore,
        // created by the build), not with Telegram's public release.keystore: anyone holding that public key could
        // sign an "update" that Android would install over a debug build.

        // DealsGram: the release build is signed with our own key, kept outside the repository. Path, alias and
        // passwords are in local.properties (DEALSGRAM_KEYSTORE, DEALSGRAM_KEY_ALIAS, DEALSGRAM_STORE_PASSWORD,
        // DEALSGRAM_KEY_PASSWORD); Telegram's release.keystore is public and never signs what we distribute.
        release {
            def props = new Properties()
            def local = rootProject.file('local.properties')
            if (local.exists()) {
                local.withInputStream { props.load(it) }
            }
            if (props['DEALSGRAM_KEYSTORE']) {
                storeFile file(props['DEALSGRAM_KEYSTORE'])
                storePassword props['DEALSGRAM_STORE_PASSWORD']
                keyAlias props['DEALSGRAM_KEY_ALIAS']
                keyPassword props['DEALSGRAM_KEY_PASSWORD'] ?: props['DEALSGRAM_STORE_PASSWORD']
            }
        }
    }

    // Without the DealsGram key the release build stops instead of producing an unsigned or wrongly signed APK.
    gradle.taskGraph.whenReady { graph ->
        def releaseTask = graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('standalone') && it.name.startsWith('package') }
        if (releaseTask && signingConfigs.release.storeFile == null) {
            throw new GradleException("DealsGram: chiave di firma mancante. Aggiungi DEALSGRAM_KEYSTORE e le password in local.properties (README.md, Building).")
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            signingConfig signingConfigs.debug
            minifyEnabled false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
        standalone {
            matchingFallbacks = ['release']
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
    }

    sourceSets.debug {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
    }
    sourceSets.standalone {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
    }

    flavorDimensions "minApi"

    productFlavors {
        afat {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
            ext {
                abiVersionCode = 9
            }
            sourceSets.standalone {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
            }
        }
    }

    defaultConfig.versionCode = Integer.parseInt(APP_VERSION_CODE)

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "app.apk"
            // DealsGram: Telegram build * 100 + our build number (DEALSGRAM_BUILD), then the ABI digit as before.
            output.versionCodeOverride = (defaultConfig.versionCode * 100 + Integer.parseInt(DEALSGRAM_BUILD)) * 10 + variant.productFlavors.get(0).abiVersionCode
        }
    }

    variantFilter { variant ->
        def names = variant.flavors*.name
        if (variant.buildType.name != "release" && !names.contains("afat")) {
            setIgnore(true)
        }
    }

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 36
        versionName APP_VERSION_NAME
        ndkVersion "27.2.12479018"

        multiDexEnabled true

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        externalNativeBuild {
            cmake {
                version '3.22.1'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-23' //, '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                targets 'tmessages.49'
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }
    namespace 'org.telegram.messenger.web'

    lintOptions {
        checkReleaseBuilds false
    }
}

apply plugin: 'com.google.gms.google-services'
